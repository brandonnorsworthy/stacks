version: 1.3.0
cache: true

# Needed so LibreChat's SSRF guard allows the self-hosted services below.
endpoints:
  allowedAddresses:
    - '192.168.5.100:11434'   # Ollama
  custom:
    - name: 'Ollama'
      apiKey: 'ollama'               # Ollama ignores the key; LibreChat requires a value
      baseURL: 'http://192.168.5.100:11434/v1/'
      models:
        default: ['qwen3.8:27b']     # tool-calling capable (see ollama /api/tags)
        fetch: true                  # list whatever the Ollama server has
      titleConvo: true
      titleModel: 'current_model'
      modelDisplayLabel: 'Ollama'
      tokenConfig:                   # LibreChat assumes a 32k window for models it doesn't know
        'qwen3.8:27b':
          prompt: 0                  # $/1M tokens (self-hosted, free)
          completion: 0
          context: 262144            # 256k, matches the model's context_length in Ollama

speech:
  stt:
    openai:
      url: 'http://host.docker.internal:10030/v1/audio/transcriptions'
      apiKey: 'whisper'        # Speaches ignores the key; LibreChat requires a value
      model: 'Systran/faster-whisper-small'

mcpSettings:
  allowedAddresses:
    - 'host.docker.internal:10010'   # todomcp
    - 'dbhub:8080'                   # dbhub (read-only dev Postgres, via the postgres network)
    - 'playwright-mcp:8931'          # headless browser (via the mcp network)
    - 'python-sandbox:3001'          # Python sandbox (via the internal-only mcp-internal network)
    - '192.168.5.100:10050'          # Spokes to-do MCP (production, on the server)

mcpServers:
  todomcp:
    type: streamable-http
    url: http://host.docker.internal:10010/mcp
    timeout: 30000
  dbhub:
    type: streamable-http
    url: http://dbhub:8080/mcp
    timeout: 30000
  browser:
    type: streamable-http
    url: http://playwright-mcp:8931/mcp
    timeout: 120000
  python:
    type: streamable-http
    url: http://python-sandbox:3001/mcp
    timeout: 120000
  spokes:
    type: streamable-http
    url: http://192.168.5.100:10050/mcp
    timeout: 30000
