version: 1.3.0
cache: true

# Needed so LibreChat's SSRF guard allows the self-hosted services below.
endpoints:
  allowedAddresses:
    - 'zcog.net:11434'   # Ollama
  custom:
    - name: 'Ollama'
      apiKey: 'ollama'               # Ollama ignores the key; LibreChat requires a value
      baseURL: 'http://zcog.net:11434/v1/'
      models:
        default: ['qwen3.8:27b']     # tool-calling capable (see ollama /api/tags)
        fetch: true                  # list whatever the Ollama server has
      titleConvo: true
      titleModel: 'current_model'
      modelDisplayLabel: 'Ollama'

speech:
  stt:
    openai:
      url: 'http://host.docker.internal:10030/v1/audio/transcriptions'
      apiKey: 'whisper'        # Speaches ignores the key; LibreChat requires a value
      model: 'Systran/faster-whisper-small'

mcpSettings:
  allowedAddresses:
    - 'host.docker.internal:10010'   # todomcp

mcpServers:
  todomcp:
    type: streamable-http
    url: http://host.docker.internal:10010/mcp
    timeout: 30000
