services:
  librechat:
    container_name: librechat
    image: ghcr.io/danny-avila/librechat:latest
    user: "10005:65534"                  # dedicated stack UID (shared by the 3 services in this stack)
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: "3080"
      MONGO_URI: mongodb://mongodb:27017/LibreChat
      MEILI_HOST: http://meilisearch:7700
    depends_on:
      mongodb:
        condition: service_healthy
      meilisearch:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"   # reach Ollama / todomcp published on the host
    ports:
      - "10020:3080"
    volumes:
      - ./librechat.yaml:/app/librechat.yaml:ro
      - type: volume
        source: librechat
        target: /app/client/public/images
        volume:
          subpath: images
      - type: volume
        source: librechat
        target: /app/uploads
        volume:
          subpath: uploads
      - type: volume
        source: librechat
        target: /app/logs
        volume:
          subpath: logs
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://localhost:3080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: 8g                        # 3cpus/8gb tier (web app / API)
    cpus: 3

  mongodb:
    container_name: librechat-mongodb
    image: mongo:9.0.2
    user: "10005:65534"
    command: mongod --noauth --bind_ip_all   # no auth; reachable only on this stack's private network
    volumes:
      - type: volume
        source: librechat
        target: /data/db
        volume:
          subpath: mongo
    healthcheck:
      test: ['CMD-SHELL', "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok' | grep -q 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    stop_grace_period: 60s               # let mongod flush
    mem_limit: 4g
    cpus: 1

  meilisearch:
    container_name: librechat-meilisearch
    image: getmeili/meilisearch:v1.54.3
    user: "10005:65534"
    environment:
      MEILI_NO_ANALYTICS: "true"
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}   # from .env (interpolated, not exposed to other services)
    volumes:
      - type: volume
        source: librechat
        target: /meili_data
        volume:
          subpath: meili
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: 2g
    cpus: 0.5

volumes:
  librechat:                 # one volume, per-service subpaths: mongo, meili, images, uploads, logs
    external: true
    name: librechat
