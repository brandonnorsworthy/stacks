services:
  app:                                   # CHANGE: service name
    container_name: app                  # CHANGE: must be unique on the server
    image: traefik/whoami:v1.10          # CHANGE: your image, pinned version
    env_file: .env
    ports:
      - "10000:80"                       # CHANGE: host:container (claim next free slot from 10000, +10 per service)
    volumes:
      - ./data:/data                     # CHANGE: container path the app writes to
    healthcheck:                         # CHANGE: placeholder example of a health check for the app
      test: ['CMD', 'curl', '-f', 'http://localhost:80/']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: 2g                        # CHANGE: pick a tier from templates/README.md (0.5cpus/2gb, 1cpu/4gb, 3cpus/8gb, 6cpus/16gb, 12cpus/32gb)
    cpus: 0.5
