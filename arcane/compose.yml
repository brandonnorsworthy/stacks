services:
  arcane:
    container_name: arcane
    image: ghcr.io/getarcaneapp/manager:v2.13.1
    env_file: .env
    ports:
      - "10000:3552"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/app/data
      # PROJECTS_DIRECTORY paths must match inside and outside the container:
      - /srv/stacks:/srv/stacks
    # host cgroup namespace so Arcane can detect its own container ID (self-upgrades)
    cgroup: host
    healthcheck:
      test: ['CMD', './arcane', 'health', '--timeout', '2s']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: 4g
    cpus: 1.0
