services:
  norsworthy-discord-status:
    container_name: norsworthy-discord-status
    image: ghcr.io/brandonnorsworthy/dn-norsworthy-discord-status:1.2.0   # pinned (bump deliberately; :latest tracks main)
    user: "10013:65534"                               # dedicated stack UID (10012 = spokes-view); nogroup GID; ./data must be owned by it
    env_file: .env
    ports:
      - "3500:8080"                                   # host port kept from the old /srv/websites deployment; container listens on 8080
    volumes:
      - ./data:/app/data                              # message-id.txt: the Discord message this service keeps editing
    networks:
      - norsworthy-net                                # reaches norsworthy-monitor (BASE_URL); see README > Deviations
    healthcheck:
      test: ['CMD', 'dotnet', '/app/StatusImageCard.dll', 'healthcheck']   # no curl in the image: the app probes its own /health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: 2g                                     # 0.5cpus/2gb tier (very simple service; uses about 200 MB)
    cpus: 0.5

networks:
  norsworthy-net:
    external: true
