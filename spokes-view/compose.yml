services:
  spokes-view:
    container_name: spokes-view
    image: ghcr.io/brandonnorsworthy/spokes-view:0.8.0   # pinned (bump deliberately; :latest tracks main)
    user: "10012:65534"                                    # dedicated stack UID (10011 = zomboid); nogroup GID
    env_file: .env
    ports:
      - "${SPOKES_VIEW_PORT:-10060}:8788"                  # host port from .env (default 10060, the next free slot after spokes' 10050); also read by the nginx map generator in the server docs
    read_only: true                                        # stateless: no volume, nothing to write
    healthcheck:
      test: ['CMD', '/usr/local/bin/spokes-view', 'healthcheck']   # distroless image: no shell or curl, the binary probes /health
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: 2g                                          # 0.5cpus/2gb tier (very simple service)
    cpus: 0.5
